services:
  - type: web
    name: adybloom-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/arreglos/activos
    buildFilter:
      paths:
        - pom.xml
        - src/**/*
        - Dockerfile
        - .dockerignore
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Primer arranque: update crea el esquema en Neon. Luego cambiar a validate.
      - key: JPA_DDL_AUTO
        value: update
      # Primer arranque: true carga accesorios y catalogo. Luego cambiar a "false".
      - key: APP_SEED_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_USUARIO
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESION_HORAS
        value: "8"

  - type: web
    name: adybloom-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    buildFilter:
      paths:
        - frontend/**/*
        - render.yaml
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
